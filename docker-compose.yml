name: personal-brain

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: brain
      POSTGRES_PASSWORD: brain
      POSTGRES_DB: brain
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Migrations run in filename order on first boot of an empty volume.
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brain -d brain"]
      interval: 5s
      retries: 10

  # Temporal needs its own database. Keeping it separate from the brain database
  # means workflow state can be wiped and rebuilt without touching canonical data.
  temporal-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporaldata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.25.2
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgres
    ports: ["7233:7233"]

  temporal-ui:
    image: temporalio/ui:2.31.2
    depends_on: [temporal]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports: ["8233:8080"]

  neo4j:
    image: neo4j:5.24-community
    # Neo4j's own guidance is 40000+; same Colima 1024 default as qdrant below.
    ulimits:
      nofile: { soft: 65535, hard: 65535 }
    environment:
      NEO4J_AUTH: neo4j/brainbrain
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports: ["7474:7474", "7687:7687"]
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      retries: 10

  # Qdrant holds several RocksDB/mmap files open per segment per collection.
  # Colima (unlike Docker Desktop) hands containers a soft nofile of 1024, which
  # four collections exhaust after a dozen ingests: Qdrant then stops accepting
  # connections and fails to flush, so every indexing call hangs.
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ulimits:
      nofile: { soft: 65535, hard: 65535 }
    ports: ["6333:6333", "6334:6334"]
    volumes:
      - qdrantdata:/qdrant/storage

  # MinIO stopped publishing public images (minio/minio on Docker Hub and
  # quay.io both refuse pulls as of 2026). bitnamilegacy/minio:2024.11.7 is the
  # same upstream release (commit cefc43e) repackaged, so behaviour is unchanged.
  # Bitnami's run.sh starts the server and console itself, hence no `command:`.
  minio:
    image: bitnamilegacy/minio:2024.11.7
    environment:
      MINIO_ROOT_USER: brain
      MINIO_ROOT_PASSWORD: brainbrain
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      retries: 10

volumes:
  pgdata:
  temporaldata:
  neo4jdata:
  qdrantdata:
  miniodata:
